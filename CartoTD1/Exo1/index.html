<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exo 1 : Géolocalisation</title>
</head>
<body>

  <h1>Exercice 1 : Géolocalisation</h1>

  <h3>getCurrentPosition()</h3>
  <p>Longitude : <span id="cur-lon">...</span></p>
  <p>Latitude : <span id="cur-lat">...</span></p>
  <p>Altitude : <span id="cur-alt">...</span></p>
  <p>Précision : <span id="cur-acc">...</span></p>
  <p>Vitesse : <span id="cur-speed">...</span></p>
  <p>Date : <span id="cur-date">...</span></p>

  <h3>watchPosition()</h3>
  <p>Longitude : <span id="watch-lon">...</span></p>
  <p>Latitude : <span id="watch-lat">...</span></p>
  <p>Altitude : <span id="watch-alt">...</span></p>
  <p>Précision : <span id="watch-acc">...</span></p>
  <p>Vitesse : <span id="watch-speed">...</span></p>
  <p>Date : <span id="watch-date">...</span></p>
  <p>Nb de mises à jour : <span id="watch-count">0</span></p>

  <p id="erreur" style="color:red"></p>

  <a href="../../index.html">Retour</a>

  <script>
    const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

    function afficher(prefixe, position) {
      const c = position.coords;
      document.getElementById(prefixe + "-lon").textContent = c.longitude;
      document.getElementById(prefixe + "-lat").textContent = c.latitude;
      document.getElementById(prefixe + "-alt").textContent = c.altitude ?? "non disponible";
      document.getElementById(prefixe + "-acc").textContent = c.accuracy + " m";
      document.getElementById(prefixe + "-speed").textContent = c.speed ?? "non disponible";
      document.getElementById(prefixe + "-date").textContent = new Date(position.timestamp).toLocaleString();
    }

    function erreur(err) {
      document.getElementById("erreur").textContent = "Erreur : " + err.message;
    }

    navigator.geolocation.getCurrentPosition(pos => afficher("cur", pos), erreur, options);

    let compteur = 0;
    navigator.geolocation.watchPosition(pos => {
      compteur++;
      document.getElementById("watch-count").textContent = compteur;
      afficher("watch", pos);
    }, erreur, options);
  </script>

</body>
</html>
